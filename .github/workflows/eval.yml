name: Evaluación RAG

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/eval.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/eval.yml'
  workflow_dispatch:

jobs:
  run-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar credenciales
      env:
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        echo "Proveedor: $LLM_PROVIDER"
        if [ "$LLM_PROVIDER" = "groq" ]; then
          KEY="$GROQ_API_KEY"; NAME="GROQ_API_KEY"; URL="https://api.groq.com/openai/v1/models"
        else
          KEY="$OPENAI_API_KEY"; NAME="OPENAI_API_KEY"; URL="https://api.openai.com/v1/models"
        fi
        if [ -z "$KEY" ]; then
          echo "::error::Falta el secret $NAME (Settings → Secrets and variables → Actions). Para usar Groq crea también la variable LLM_PROVIDER=groq."; exit 1
        fi
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $KEY" "$URL")
        if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
          echo "::error::El secret $NAME no es válido (HTTP $STATUS): la key fue revocada, venció o se copió mal. Genera una nueva y actualiza el secret."; exit 1
        fi
        echo "Credenciales OK ($NAME, HTTP $STATUS)"
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "::error::Falta el secret OPENAI_API_KEY: el juez es openai:/gpt-4o-mini."; exit 1
        fi
        # Prueba real del juez: una llamada mínima a gpt-4o-mini (detecta clave inválida o sin saldo)
        BODY=$(curl -s -w "\n%{http_code}" https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
          -d '{"model":"gpt-4o-mini","max_tokens":1,"messages":[{"role":"user","content":"ok"}]}')
        CODE=$(echo "$BODY" | tail -n1)
        if [ "$CODE" != "200" ]; then
          MSG=$(echo "$BODY" | head -n -1 | python -c "import sys,json; print(json.load(sys.stdin).get('error',{}).get('message','')[:200])" 2>/dev/null)
          echo "::error::El juez (OpenAI) respondió HTTP $CODE: $MSG"; exit 1
        fi
        echo "Juez OK (OpenAI gpt-4o-mini, HTTP 200)"
        # Prueba del juez a través de MLflow, igual que en la evaluación
        python -c "from mlflow.genai.scorers import Correctness; fb = Correctness(model='openai:/gpt-4o-mini')(inputs={'question': '¿Cuánto es 2+2?'}, outputs='4', expectations={'expected_response': '4'}); print('Juez MLflow:', fb.value, fb.error)"

    - name: Ejecutar evaluación (jueces LLM de MLflow)
      env:
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
        EVAL_MODEL: ${{ vars.EVAL_MODEL || 'openai:/gpt-4o-mini' }}
        PROMPT_VERSION: ${{ vars.PROMPT_VERSION || 'prompts:/asistente_trading@v1_asistente_trading' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python -m app.prompt_registry
        python -c "from app.rag_pipeline import save_vectorstore; save_vectorstore()"
        python app/run_eval.py

    - name: Quality gate (umbrales mínimos)
      run: pytest tests/test_run_eval.py -v

    - name: Guardar resultados de MLflow
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-db
        path: mlflow.db
