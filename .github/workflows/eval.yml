name: Evaluación RAG

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/eval.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/eval.yml'
  workflow_dispatch:

jobs:
  run-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar credenciales
      env:
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python -c "import os; k=os.environ.get('OPENAI_API_KEY',''); print('Diagnóstico OPENAI_API_KEY: largo', len(k), '| empieza por sk-:', k.strip().startswith('sk-'), '| tiene espacios/saltos:', k != k.strip() or any(c.isspace() for c in k), '| contiene =:', '=' in k)"
        # Limpia espacios o saltos de línea que se cuelan al pegar las keys en GitHub
        OPENAI_API_KEY="$(printf %s "$OPENAI_API_KEY" | tr -d '[:space:]')"; export OPENAI_API_KEY
        GROQ_API_KEY="$(printf %s "$GROQ_API_KEY" | tr -d '[:space:]')"; export GROQ_API_KEY
        echo "Proveedor: $LLM_PROVIDER"
        if [ "$LLM_PROVIDER" = "groq" ]; then
          KEY="$GROQ_API_KEY"; NAME="GROQ_API_KEY"; URL="https://api.groq.com/openai/v1/models"
        else
          KEY="$OPENAI_API_KEY"; NAME="OPENAI_API_KEY"; URL="https://api.openai.com/v1/models"
        fi
        if [ -z "$KEY" ]; then
          echo "::error::Falta el secret $NAME (Settings → Secrets and variables → Actions). Para usar Groq crea también la variable LLM_PROVIDER=groq."; exit 1
        fi
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $KEY" "$URL")
        if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
          echo "::error::El secret $NAME no es válido (HTTP $STATUS): la key fue revocada, venció o se copió mal. Genera una nueva y actualiza el secret."; exit 1
        fi
        echo "Credenciales OK ($NAME, HTTP $STATUS)"
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "::error::Falta el secret OPENAI_API_KEY: el juez es openai:/gpt-4o-mini."; exit 1
        fi
        # Prueba real del juez antes de gastar 17 min: llamada mínima vía SDK y vía MLflow
        python - <<'PY'
        import sys
        from openai import OpenAI
        try:
            OpenAI().chat.completions.create(model="gpt-4o-mini", max_tokens=1, messages=[{"role": "user", "content": "ok"}])
            print("Juez OK vía SDK (gpt-4o-mini)")
        except Exception as e:
            print(f"::error::El juez (OpenAI) falló: {type(e).__name__}: {str(e)[:300]}"); sys.exit(1)
        from mlflow.genai.scorers import Correctness
        fb = Correctness(model="openai:/gpt-4o-mini")(inputs={"question": "¿Cuánto es 2+2?"}, outputs="4", expectations={"expected_response": "4"})
        if fb.error:
            print(f"::error::El juez vía MLflow falló: {str(fb.error)[:500]}"); sys.exit(1)
        print("Juez OK vía MLflow:", fb.value)
        PY

    - name: Ejecutar evaluación (jueces LLM de MLflow)
      env:
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
        EVAL_MODEL: ${{ vars.EVAL_MODEL || 'openai:/gpt-4o-mini' }}
        PROMPT_VERSION: ${{ vars.PROMPT_VERSION || 'prompts:/asistente_trading@v1_asistente_trading' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        # Limpia espacios o saltos de línea que se cuelan al pegar las keys en GitHub
        OPENAI_API_KEY="$(printf %s "$OPENAI_API_KEY" | tr -d '[:space:]')"; export OPENAI_API_KEY
        GROQ_API_KEY="$(printf %s "$GROQ_API_KEY" | tr -d '[:space:]')"; export GROQ_API_KEY
        python -m app.prompt_registry
        python -c "from app.rag_pipeline import save_vectorstore; save_vectorstore()"
        python app/run_eval.py

    - name: Quality gate (umbrales mínimos)
      run: pytest tests/test_run_eval.py -v

    - name: Guardar resultados de MLflow
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-db
        path: mlflow.db
